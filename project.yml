name: Tabby
options:
  bundleIdPrefix: com.seanking
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Stable signing identity so Accessibility trust persists across builds
    # (ad-hoc "Sign to Run Locally" re-signs every build and loses the grant).
    # Manual style uses the local "Apple Development" cert without needing the
    # team's account registered in Xcode.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
    DEVELOPMENT_TEAM: Z48RX794H9
targets:
  Tabby:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tabby
    info:
      path: Tabby/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seanking.Tabby
        PRODUCT_NAME: Tabby
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TabbyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TabbyTests
    dependencies:
      - target: Tabby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seanking.TabbyTests
        GENERATE_INFOPLIST_FILE: YES
